function render(){if(!user)return;if(!space){$('headerPeople').innerHTML='';$('home').innerHTML='<div class="card"><h2>Ждём приглашения 💌</h2><p>Аккаунт создан, но ещё не добавлен в общее пространство. Попросите администратора добавить участника.</p><button class="btn alt" id="logout">Выйти</button></div>';$('logout').onclick=signOutFromApp;for(const id of ['shopping','meals','budget'])$(id).innerHTML='';return}
  const drafts = snapshotDrafts();
  const purchases = items.filter(item => !item.recipe_only);
  const groups = groupProducts(purchases);
  const done = groups.filter(group => group.purchased).length;
  const pct = groups.length ? Math.round(done / groups.length * 100) : 0;
  const total = purchases.reduce((sum, item) => sum + (item.purchased ? Math.round(Number(item.price || 0) * 100) : 0), 0) / 100;
  renderHome(groups, done, pct, total);
  renderShopping(groups, done);
  renderMeals();
  observeMealPhotos();
  $('budget').innerHTML = sectionHeading('budget', 'Бюджет') + `
    <div class="card">
      <div class="muted">Потрачено на отмеченные покупки</div>
      <h1>${money(total)}</h1>
      <p class="muted small">В расчёт входят цены отмеченных покупок.</p>
    </div>`;
  restoreDrafts(drafts);
  bindPurchaseForms();
}
const authStorageKey = 'sb-jqvgvaoihmwwopamqobx-auth-token';
function rememberedAccount() {
  try {
    const session = JSON.parse(localStorage.getItem(authStorageKey));
    return session?.refresh_token ? session.user?.id || null : null;
  } catch {
    return null;
  }
}

let storagePromise;
function offlineDatabase() {
  if (storagePromise) return storagePromise;
  storagePromise = new Promise((resolve, reject) => {
    const request = indexedDB.open('our-shopping-offline', 1);
    request.onupgradeneeded = () => {
      request.result.createObjectStore('accounts');
      request.result.createObjectStore('photos');
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('Хранилище недоступно'));
  }).catch(error => {
    storagePromise = null;
    throw error;
  });
  return storagePromise;
}

async function storeRequest(storeName, mode, work) {
  const db = await offlineDatabase();
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(storeName, mode);
    const store = transaction.objectStore(storeName);
    let result;
    transaction.oncomplete = () => resolve(result);
    transaction.onabort = () => reject(transaction.error || new Error('Не удалось сохранить данные'));
    work(store, value => { result = value; });
  });
}

function readSaved(storeName, key) {
  return storeRequest(storeName, 'readonly', (store, done) => {
    const request = store.get(key);
    request.onsuccess = () => done(request.result);
  });
}

function mutateAccount(account, change) {
  return storeRequest('accounts', 'readwrite', (store, done) => {
    const request = store.get(account);
    request.onsuccess = () => {
      const state = request.result || {snapshot: null, pending: {}};
      change(state);
      store.put(state, account);
      done(state);
    };
  });
}

const emptyOfflineState = () => ({snapshot: null, pending: {}});
let offlineState = emptyOfflineState();
let validatedAccount = null;
let networkUnavailable = !navigator.onLine;
let connectPromise = null;
let flushPromise = null;
let syncIssue = false;
let sessionGeneration = 0;
let photoWarming = null;
const photoDownloads = new Map();
const photoKey = (account, path) => account + '/' + path;

function pendingPurchases() {
  return Object.values(offlineState.pending).filter(entry => entry.spaceId === space?.id);
}

function publishSyncStatus() {
  const status = $('syncStatus');
  if (!status) return;
  const count = pendingPurchases().length;
  const offline = networkUnavailable || !navigator.onLine;
  status.textContent = [
    offline ? 'Офлайн' : syncIssue ? 'Не удалось синхронизировать' : '',
    count ? 'К отправке: ' + count : ''
  ].filter(Boolean).join(' · ');
  status.hidden = !status.textContent;
}

function setConnectionUnavailable(unavailable) {
  networkUnavailable = unavailable;
  if (unavailable) validatedAccount = null;
  publishSyncStatus();
}

function mutationNeedsInternet() {
  if (!networkUnavailable && navigator.onLine && validatedAccount === user?.id) return false;
  alert('Для этого действия нужен интернет. Галочки в покупках можно менять офлайн.');
  return true;
}

function applySavedPurchases(shouldRender = true) {
  const snapshot = offlineState.snapshot;
  if (!snapshot || snapshot.space.id !== space?.id) return;
  items = snapshot.items.map(item => {
    const entry = offlineState.pending[item.id];
    if (item.recipe_only || !entry || entry.spaceId !== space.id || item.purchased === entry.checked) return item;
    return {
      ...item,
      purchased: entry.checked,
      purchased_by: entry.checked ? user.id : null,
      purchased_at: entry.checked ? entry.purchasedAt : null
    };
  });
  meals = snapshot.meals;
  members = snapshot.members;
  publishSyncStatus();
  if (shouldRender) render();
}

function isNetworkFailure(error) {
  const status = Number(error?.status || 0);
  return navigator.onLine === false || status >= 500 || error?.name === 'AuthRetryableFetchError'
    || /(?:failed to fetch|network|load failed|fetch failed|timed out|abort|timeout)/i.test(error?.message || '');
}

function showLaunchState(mode, text = '') {
  $('launchView').classList.toggle('hidden', mode !== 'launch');
  $('launchMessage').textContent = text || 'Открываем покупки…';
  $('retryLaunch').hidden = !text;
  $('auth').classList.toggle('hidden', mode !== 'login');
  $('app').classList.toggle('hidden', mode !== 'app');
  $('nav').classList.toggle('hidden', mode !== 'app');
}

function openAccountView() {
  showLaunchState('app');
  if (currentMealId() && tab !== 'meals') showTab('meals');
  else render();
  publishSyncStatus();
}

function useCachedAccount(account, state) {
  if (!state?.snapshot || rememberedAccount() !== account) return false;
  user = {id: account};
  offlineState = state;
  space = state.snapshot.space;
  loadMealPreferences();
  applySavedPurchases(false);
  openAccountView();
  return true;
}

async function clearLocalAccount(account) {
  if (!account) return;
  await Promise.allSettled([
    storeRequest('accounts', 'readwrite', store => store.delete(account)),
    storeRequest('photos', 'readwrite', store => {
      const prefix = account + '/';
      store.delete(IDBKeyRange.bound(prefix, prefix + '\uffff'));
    })
  ]);
}

function resetAccountView() {
  sessionGeneration += 1;
  validatedAccount = null;
  user = space = null;
  offlineState = emptyOfflineState();
  items = meals = members = [];
  syncIssue = false;
  mealPhotoObserver?.disconnect();
  for (const path of mealPhotoCache.keys()) releaseMealPhoto(path);
  if ($('mealDetailsDialog').open) $('mealDetailsDialog').close();
  if ($('editIngredientDialog').open) $('editIngredientDialog').close();
  if (channel) {
    const previous = channel;
    channel = null;
    void sb.removeChannel(previous);
  }
  showLaunchState('login');
}

async function signOutFromApp() {
  const account = user?.id;
  if (pendingPurchases().length && !confirm('На телефоне есть неотправленные отметки. При выходе они будут удалены. Выйти?')) return;
  const {error} = await sb.auth.signOut();
  if (error) {
    alert(error.message);
    return;
  }
  await clearLocalAccount(account);
  location.reload();
}

function purchasePatch(entry, account) {
  return {
    purchased: entry.checked,
    purchased_by: entry.checked ? account : null,
    purchased_at: entry.checked ? entry.purchasedAt : null
  };
}

function sendPurchase(entry, account, ids) {
  return sb.from('shopping_items').update(purchasePatch(entry, account))
    .eq('space_id', entry.spaceId).eq('recipe_only', false).eq('purchased', !entry.checked).in('id', ids)
    .select('id,purchased,purchased_by,purchased_at');
}

async function flushPurchases() {
  if (flushPromise) return flushPromise;
  const account = user?.id;
  if (!account || validatedAccount !== account || !space || !navigator.onLine || networkUnavailable) return;
  const workspace = space.id;
  const work = async () => {
    let sent = false;
    while (user?.id === account && validatedAccount === account && space?.id === workspace) {
      const saved = await readSaved('accounts', account).catch(() => null);
      if (!saved) return sent;
      const pending = Object.values(saved.pending).filter(entry => entry.spaceId === workspace);
      if (!pending.length) return sent;
      const first = pending[0];
      const batch = pending.filter(entry => entry.operationId === first.operationId).slice(0, 40);
      const {data, error} = await sendPurchase(first, account, batch.map(entry => entry.id));
      if (error) {
        if (isNetworkFailure(error)) setConnectionUnavailable(true);
        else syncIssue = true;
        publishSyncStatus();
        return sent;
      }
      if (user?.id !== account) return sent;
      refreshVersion += 1;
      const returned = new Map((data || []).map(row => [row.id, row]));
      const reconciled = await mutateAccount(account, state => {
        for (const entry of batch) {
          if (state.pending[entry.id]?.operationId === entry.operationId) delete state.pending[entry.id];
        }
        if (state.snapshot?.space.id === workspace) {
          state.snapshot.items = state.snapshot.items.map(item => returned.has(item.id) ? {...item, ...returned.get(item.id)} : item);
        }
      });
      if (user?.id !== account) return sent;
      offlineState = reconciled;
      syncIssue = false;
      sent = true;
      applySavedPurchases();
    }
    return sent;
  };
  const run = async () => {
    try {
      const sent = navigator.locks
        ? await navigator.locks.request('our-shopping-purchases-' + account, work)
        : await work();
      if (sent && validatedAccount === account) await refresh();
    } catch (error) {
      if (isNetworkFailure(error)) setConnectionUnavailable(true);
      else syncIssue = true;
      publishSyncStatus();
    }
  };
  flushPromise = run().finally(() => { flushPromise = null; });
  return flushPromise;
}

async function queuePurchase(checkbox) {
  const account = user?.id;
  if (!account || !space) return;
  const checked = checkbox.checked;
  const ids = checkbox.dataset.check.split(',');
  const entry = {checked, spaceId: space.id, operationId: crypto.randomUUID(), purchasedAt: new Date().toISOString()};
  checkbox.disabled = true;
  try {
    const next = await mutateAccount(account, state => {
      state.snapshot ||= offlineState.snapshot;
      for (const id of ids) state.pending[id] = {...entry, id};
    });
    if (user?.id !== account) return;
    offlineState = next;
    applySavedPurchases();
    void flushPurchases();
  } catch {
    if (networkUnavailable || !navigator.onLine || validatedAccount !== account) {
      alert('Не удалось сохранить отметку на телефоне.');
      render();
      return;
    }
    const {error} = await sendPurchase(entry, account, ids);
    if (error) alert(error.message);
    await refresh();
    if (error) render();
  } finally {
    checkbox.disabled = false;
  }
}

async function downloadMealPhoto(account, path) {
  const key = photoKey(account, path);
  if (photoDownloads.has(key)) return photoDownloads.get(key);
  const download = (async () => {
    const cached = await readSaved('photos', key).catch(() => null);
    if (cached || user?.id !== account) return cached;
    if (networkUnavailable || !navigator.onLine || validatedAccount !== account) return null;
    const {data, error} = await sb.storage.from(mealPhotoBucket).download(path);
    if (error || !data || user?.id !== account) return null;
    const stillUsed = meals.some(meal => meal.photo_path === path);
    if (stillUsed) {
      await storeRequest('photos', 'readwrite', store => store.put(data, key)).catch(() => {});
    }
    return data;
  })().finally(() => photoDownloads.delete(key));
  photoDownloads.set(key, download);
  return download;
}

function cacheAllMealPhotos() {
  if (photoWarming || !user || networkUnavailable || validatedAccount !== user.id) return;
  const account = user.id;
  const paths = [...new Set(meals.map(meal => meal.photo_path).filter(Boolean))];
  if (!paths.length) return;
  let offset = 0;
  const fill = async () => {
    while (offset < paths.length && user?.id === account && !networkUnavailable) {
      const path = paths[offset++];
      await downloadMealPhoto(account, path).catch(() => null);
    }
  };
  photoWarming = Promise.all(Array.from({length: Math.min(3, paths.length)}, fill))
    .finally(() => {
      photoWarming = null;
      if (user?.id === account && meals.some(meal => meal.photo_path && !paths.includes(meal.photo_path))) cacheAllMealPhotos();
    });
}

async function connectAccount() {
  if (connectPromise) return connectPromise;
  if (!navigator.onLine) {
    setConnectionUnavailable(true);
    if (!user) showLaunchState('launch', 'Для первого входа или загрузки списка нужен интернет.');
    return;
  }
  const generation = sessionGeneration;
  const run = async () => {
    try {
      const {data, error} = await sb.auth.getUser();
      if (generation !== sessionGeneration) return;
      const account = data?.user;
      if (error) {
        if (isNetworkFailure(error)) throw error;
        if (error.name !== 'AuthSessionMissingError' && ![400, 401, 403].includes(error.status)) throw error;
      }
      if (!account || error) {
        resetAccountView();
        return;
      }
      const membership = await sb.from('space_members').select('space_id,spaces(id,name)').eq('user_id', account.id).limit(1);
      if (generation !== sessionGeneration) return;
      if (membership.error) throw {...membership.error, status: membership.status};
      const workspace = membership.data?.[0]?.spaces || null;
      const saved = await readSaved('accounts', account.id).catch(() => null);
      if (generation !== sessionGeneration) return;
      const switched = user?.id !== account.id || space?.id !== workspace?.id;
      const firstView = switched || $('app').classList.contains('hidden');
      user = account;
      space = workspace;
      validatedAccount = account.id;
      setConnectionUnavailable(false);
      if (switched) {
        items = meals = members = [];
        loadMealPreferences();
        for (const path of mealPhotoCache.keys()) releaseMealPhoto(path);
      }
      offlineState = saved || (!switched ? offlineState : emptyOfflineState());
      if (offlineState.snapshot?.space.id !== space?.id || !space) {
        offlineState = {...offlineState, snapshot: null};
        if (saved?.snapshot) {
          await mutateAccount(account.id, state => { state.snapshot = null; }).catch(() => {});
        }
      }
      if (generation !== sessionGeneration) return;
      if (!space) {
        openAccountView();
        return;
      }
      if (offlineState.snapshot) applySavedPurchases(false);
      if (firstView && offlineState.snapshot) openAccountView();
      if (subscribedWorkspace !== space.id || switched) await subscribeToList();
      else await refresh();
      if (generation !== sessionGeneration) return;
      if (firstView && $('app').classList.contains('hidden')) {
        if (offlineState.snapshot) openAccountView();
        else showLaunchState('launch', 'Не удалось загрузить список. Попробуй снова с интернетом.');
      }
      void flushPurchases();
    } catch (error) {
      if (generation !== sessionGeneration) return;
      const offline = isNetworkFailure(error);
      setConnectionUnavailable(offline);
      if (!user || $('app').classList.contains('hidden')) {
        showLaunchState('launch', offline ? 'Не удалось подключиться. Попробуй снова с интернетом.' : 'Не удалось открыть список. Попробуй ещё раз.');
      } else if (!offline) {
        syncIssue = true;
        publishSyncStatus();
      }
    }
  };
  connectPromise = run().finally(() => { connectPromise = null; });
  return connectPromise;
}

async function init() {
  const account = rememberedAccount();
  if (account) {
    const saved = await readSaved('accounts', account).catch(() => null);
    useCachedAccount(account, saved);
  }
  await connectAccount();
}

$('retryLaunch').onclick = () => { void connectAccount(); };
window.addEventListener('online', () => { void connectAccount(); });
window.addEventListener('offline', () => setConnectionUnavailable(true));
window.addEventListener('pageshow', event => { if (event.persisted) void connectAccount(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (user || rememberedAccount())) void connectAccount();
});
setInterval(() => {
  if (document.visibilityState !== 'visible' || !user || !navigator.onLine) return;
  if (networkUnavailable || validatedAccount !== user.id) void connectAccount();
  else if (pendingPurchases().length) void flushPurchases();
}, 5000);

sb.auth.onAuthStateChange(event => {
  if (event === 'SIGNED_OUT') resetAccountView();
});

void init();
</script>

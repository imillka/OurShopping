<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f9fc"><title>Наши покупки</title><style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}body{margin:0;background:#fff;color:#111827;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;overflow-x:hidden}button,input,select{font-family:inherit}button{cursor:pointer}input,select,textarea{font-size:16px!important}main{max-width:560px;margin:auto;padding:27px 22px 118px}h1{font-size:clamp(27px,7vw,36px);letter-spacing:-1.3px;font-weight:800;margin:5px 0}h2{font-size:22px;letter-spacing:-.6px;margin:0 0 14px}.muted{color:#858b98}.card{background:#fff;border:1px solid #edf0f5;border-radius:25px;padding:19px;margin:17px 0;box-shadow:0 8px 26px #192d4a0b}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.pill{background:#eaf2ff;color:#2376ec;border-radius:30px;padding:8px 13px;font-size:13px;font-weight:600}.btn{border:0;border-radius:16px;padding:12px 17px;background:#e5f0ff;color:#1673ec;font-weight:700}.btn.alt{background:#f2f4f8;color:#5c6778}.btn.danger{background:#fff0f0;color:#bc4a4a}input,select{width:100%;min-width:0;border:1px solid #e6eaf1;border-radius:14px;padding:13px;background:#fff;margin:7px 0;outline-color:#79aafa}.item{padding:15px 2px;border-bottom:1px solid #edf0f4;min-width:0}.item:last-child{border:0}.check{width:23px;height:23px;accent-color:#30be4c;flex-shrink:0}.itemname{font-size:16px;font-weight:500;overflow-wrap:anywhere}.done .itemname{text-decoration:line-through;color:#9299a5}.small{font-size:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffef;border-top:1px solid #e8ebf0;display:flex;justify-content:center;padding:12px 8px max(15px,env(safe-area-inset-bottom));backdrop-filter:blur(20px);z-index:10}.nav button{background:none;border:0;color:#777f8b;flex:1;max-width:140px;padding:5px;font-size:12px}.nav button.active{color:#1378f7;font-weight:750}.nav span{display:block;font-size:24px;margin-bottom:5px}.hidden{display:none!important}.bar{height:10px;background:#e5e9ef;border-radius:10px;overflow:hidden}.bar i{display:block;background:#2cc849;height:100%;border-radius:10px}.avatar{display:inline-grid;place-items:center;width:36px;height:36px;border:3px solid #fff;margin-left:-7px;border-radius:50%;background:#e5edff;color:#4178d7;font-weight:700;box-shadow:0 1px 4px #0001}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:7px 10px}.notice{background:#fff4d8;border-radius:12px;padding:12px;margin:12px 0;color:#755b20}label{display:block;margin-top:12px;font-weight:600}.link{border:0;background:none;color:#7d8b9d}.title{font-weight:750;font-size:17px}.hero{background:#f7e9e3 url('./new-year-banner.jpg') center center/cover no-repeat;border:0;overflow:hidden;position:relative;padding:22px}.hero:before{display:none}.hero h2{font-size:25px;margin:5px 0 4px}.hero .row{position:relative}.hero .btn{background:#e5f0ff}.hero p{margin:13px 0}.empty{padding:25px;text-align:center;color:#8893a5}#app>header{padding:12px 0 19px}#app>header:before{content:"";display:none}#app>header .btn{font-size:13px;padding:11px 14px}#home>.card:not(.hero){box-shadow:none}#home>.card:not(.hero) .btn{font-size:13px}#shopping>h2,#meals>h2,#budget>h2{margin:20px 0}.item .muted{margin-top:5px}#auth{margin-top:15vh}#auth .btn{background:#1979ef;color:white}button:active{transform:scale(.98)}@media(max-width:390px){main{padding-left:16px;padding-right:16px}.hero h2{font-size:22px}.avatar{width:31px;height:31px}.card{padding:16px}}</style></head><body><main><div id="auth" class="card"><h1>🛒 Наши покупки</h1><p class="muted">Общие планы, блюда и покупки — в одном месте.</p><form id="authForm"><label>Электронная почта</label><input id="email" type="email" autocomplete="email" required><label>Пароль</label><input id="password" type="password" autocomplete="current-password" minlength="6" required><button class="btn" style="width:100%;margin-top:15px">Войти</button></form><p id="authError" class="muted small"></p><p class="small muted">Аккаунты создаются по приглашению администратора.</p></div><div id="app" class="hidden"><header class="row between"><div><div class="muted small">Ваши общие планы ✨</div><h1>Наши покупки</h1></div><button id="logout" class="btn alt">Выйти</button></header><section id="home"></section><section id="shopping" class="hidden"></section><section id="meals" class="hidden"></section><section id="budget" class="hidden"></section></div></main><nav id="nav" class="nav hidden"><button data-tab="home" class="active"><span>🏠</span>Главная</button><button data-tab="shopping"><span>🛒</span>Покупки</button><button data-tab="meals"><span>🍽️</span>Блюда</button><button data-tab="budget"><span>💳</span>Бюджет</button></nav><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://jqvgvaoihmwwopamqobx.supabase.co','sb_publishable_atkJptARPDCq_JxYMKUveA_oPbCjQuR',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let user=null,space=null,items=[],meals=[],members=[],tab='home',channel=null;
const nameOf=id=>members.find(m=>m.user_id===id)?.display_name||'Участник';
function showTab(t){tab=t;for(const x of ['home','shopping','meals','budget'])$(x).classList.toggle('hidden',x!==t);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
$('authForm').onsubmit=async e=>{e.preventDefault();$('authError').textContent='Входим…';const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('authError').textContent=error?error.message:'';if(!error)await init()};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function init(){const {data:{user:u}}=await sb.auth.getUser();user=u;$('auth').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('nav').classList.toggle('hidden',!user);if(!user)return;await loadSpace();if(space){await refresh();if(channel)await sb.removeChannel(channel);channel=sb.channel('shared-'+space.id).on('postgres_changes',{event:'*',schema:'public',table:'shopping_items',filter:'space_id=eq.'+space.id},()=>refresh()).on('postgres_changes',{event:'*',schema:'public',table:'meals',filter:'space_id=eq.'+space.id},()=>refresh()).subscribe()}else render()}
async function loadSpace(){const {data,error}=await sb.from('space_members').select('space_id,spaces(id,name)').eq('user_id',user.id).limit(1);if(error){alert(error.message);return}space=data?.[0]?.spaces||null}
async function refresh(){const [a,b,c]=await Promise.all([sb.from('shopping_items').select('*').eq('space_id',space.id).order('created_at'),sb.from('meals').select('*').eq('space_id',space.id).order('created_at'),sb.from('space_members').select('user_id,display_name').eq('space_id',space.id)]);for(const r of [a,b,c])if(r.error){alert(r.error.message);return}items=a.data||[];meals=b.data||[];members=c.data||[];render()}
function render(){if(!user)return;if(!space){$('home').innerHTML='<div class="card"><h2>Ждём приглашения 💌</h2><p>Аккаунт создан, но ещё не добавлен в общее пространство. Добавьте пользователя через SQL из README.</p></div>';for(const id of ['shopping','meals','budget'])$(id).innerHTML='';return}
const done=items.filter(x=>x.purchased).length,pct=items.length?Math.round(done/items.length*100):0,total=items.reduce((a,x)=>a+(x.purchased?Number(x.price||0):0),0);
$('home').innerHTML='<div class="card hero"><div class="row between"><div><div class="muted small">🎄 Общий список покупок</div><h2>'+escape(space.name)+'</h2></div><div>'+members.map(m=>'<span class="avatar" title="'+escape(m.display_name)+'">'+escape(m.display_name?.[0]||'?')+'</span>').join(' ')+'</div></div><p>'+done+' из '+items.length+' покупок выполнено</p><div class="bar"><i style="width:'+pct+'%"></i></div><p class="muted small">'+pct+'% готово</p><button class="btn" id="goShopping">Открыть покупки →</button></div><div class="card"><h2>🍽️ Блюда</h2><p>'+meals.length+' запланировано</p><button class="btn alt" id="goMeals">Посмотреть блюда</button></div><div class="card"><h2>💰 Расходы</h2><div class="title">'+total.toLocaleString('ru-RU')+' ₽</div></div>';
$('goShopping').onclick=()=>showTab('shopping');$('goMeals').onclick=()=>showTab('meals');
$('shopping').innerHTML='<div class="row between"><h2>🛒 Покупки</h2><span class="pill">'+done+'/'+items.length+'</span></div><div class="card"><form id="addItem"><input name="name" placeholder="Что купить?" maxlength="120" required><div class="row"><input name="quantity" placeholder="Количество (например, 2 кг)" maxlength="40"><input name="price" type="number" min="0" step="0.01" placeholder="Цена ₽"></div><button class="btn">+ Добавить</button></form></div><div class="card">'+(items.length?[...items].sort((a,b)=>Number(a.purchased)-Number(b.purchased)).map(i=>'<div class="item row '+(i.purchased?'done':'')+'"><input class="check" type="checkbox" data-check="'+i.id+'" '+(i.purchased?'checked':'')+'><div class="grow"><div class="itemname">'+escape(i.name)+'</div><div class="muted small">'+escape(i.quantity||'')+(i.price?' · '+Number(i.price).toLocaleString('ru-RU')+' ₽':'')+(i.purchased?' · Купил(а): '+escape(nameOf(i.purchased_by)):'')+'</div></div><button class="link" data-del="'+i.id+'" aria-label="Удалить">✕</button></div>').join(''):'<div class="empty">Пока пусто. Добавьте первую покупку!</div>')+'</div>';
$('addItem').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const {error}=await sb.from('shopping_items').insert({space_id:space.id,name:String(f.get('name')).trim(),quantity:String(f.get('quantity')||''),price:f.get('price')?Number(f.get('price')):null,created_by:user.id});if(error)alert(error.message);else{e.target.reset();await refresh()}};
document.querySelectorAll('[data-check]').forEach(el=>el.onchange=async()=>{const checked=el.checked;const {error}=await sb.from('shopping_items').update({purchased:checked,purchased_by:checked?user.id:null,purchased_at:checked?new Date().toISOString():null}).eq('id',el.dataset.check);if(error)alert(error.message);await refresh()});
document.querySelectorAll('[data-del]').forEach(el=>el.onclick=async()=>{if(!confirm('Удалить покупку?'))return;const {error}=await sb.from('shopping_items').delete().eq('id',el.dataset.del);if(error)alert(error.message);await refresh()});
$('meals').innerHTML='<h2>🍽️ Блюда</h2><div class="card"><form id="addMeal"><input name="name" placeholder="Название блюда" maxlength="120" required><button class="btn">+ Добавить блюдо</button></form></div>'+meals.map(m=>'<div class="card"><div class="row between"><div class="title">'+escape(m.name)+'</div><button class="link" data-mealdel="'+m.id+'">Удалить</button></div><p class="muted small">Добавляйте ингредиенты в покупки ниже</p><form data-ingredient="'+m.id+'"><input name="name" placeholder="Ингредиент" required maxlength="120"><input name="quantity" placeholder="Количество"><button class="btn alt">+ В покупки</button></form></div>').join('');
$('addMeal').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('meals').insert({space_id:space.id,name:String(new FormData(e.target).get('name')).trim(),created_by:user.id});if(error)alert(error.message);else await refresh()};
document.querySelectorAll('[data-ingredient]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const d=new FormData(f);const {error}=await sb.from('shopping_items').insert({space_id:space.id,meal_id:f.dataset.ingredient,name:String(d.get('name')).trim(),quantity:String(d.get('quantity')||''),created_by:user.id});if(error)alert(error.message);else{f.reset();await refresh()}});
document.querySelectorAll('[data-mealdel]').forEach(b=>b.onclick=async()=>{if(!confirm('Удалить блюдо? Ингредиенты останутся в покупках.'))return;const {error}=await sb.from('meals').delete().eq('id',b.dataset.mealdel);if(error)alert(error.message);await refresh()});
$('budget').innerHTML='<h2>💳 Бюджет</h2><div class="card"><div class="muted">Потрачено на отмеченные покупки</div><h1>'+total.toLocaleString('ru-RU')+' ₽</h1><p class="muted small">Указывайте цену товара при добавлении покупки. В расчёт входят только купленные товары.</p></div>'}
sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){user=null;$('auth').classList.remove('hidden');$('app').classList.add('hidden');$('nav').classList.add('hidden')}});init();
</script></body></html>
